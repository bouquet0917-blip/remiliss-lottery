<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年 新年運試し抽選｜ReMiliss</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:#0b0f14;
  color:#e9eef6;
}
.wrap{max-width:680px;margin:40px auto;padding:0 20px}
h1{font-size:26px;text-align:center;letter-spacing:.08em}
.card{
  background:#111824;
  border-radius:16px;
  padding:24px;
  margin-top:24px;
}
label{display:block;margin-top:16px;font-size:13px;color:#a8b3c2}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#0e141f;
  color:#fff;
  margin-top:6px;
}
button{
  width:100%;
  margin-top:24px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(180deg,#f0d28a,#d7b46a);
  font-weight:bold;
  letter-spacing:.1em;
}
.note{margin-top:12px;font-size:12px;color:#a8b3c2;text-align:center}

/* ===== 当選モーダル ===== */
.winModal{
  position:fixed;inset:0;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(6px);
}
.winModal.show{display:grid}
.winBox{
  background:#111824;
  border-radius:20px;
  padding:32px;
  text-align:center;
  width:90%;max-width:420px;
  position:relative;
}
.winBox::before{
  content:"";
  position:absolute;inset:-2px;
  border-radius:22px;
  background:radial-gradient(circle,#f0d28a33,transparent 60%);
}
.winPrize{font-size:22px;font-weight:bold;letter-spacing:.1em}
.winText{margin-top:10px;font-size:14px;color:#d7b46a}
.closeBtn{
  margin-top:20px;
  background:none;
  border:1px solid #555;
  color:#fff;
  padding:10px 20px;
  border-radius:20px;
}
</style>
</head>

<body>
<div class="wrap">
  <h1>2026年の始まりの運試し！</h1>

  <div class="card">
    <form id="lotteryForm">
      <label>抽選コード</label>
      <input id="ticketCode" placeholder="RM26-XXXX-XXXX" required>

      <label>お名前（予約名 / LINE名）</label>
      <input id="customerName" required>

      <button type="submit">抽選する</button>
      <div class="note" id="formNote">※お一人様1回限り</div>
    </form>
  </div>
</div>

<!-- ===== 当選表示 ===== -->
<div class="winModal" id="winModal">
  <div class="winBox">
    <div class="winPrize" id="winPrize"></div>
    <div class="winText">詳細は公式LINEよりご案内します</div>
    <button class="closeBtn" onclick="closeWin()">閉じる</button>
  </div>
</div>

<script>
/* ===== GAS WebアプリURL ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbynZycvNh9rXCC8Ot7eZKAWd-jaX3wYK_3VxwNQj_c/exec";

/* ===== elements ===== */
const form = document.getElementById("lotteryForm");
const code = document.getElementById("ticketCode");
const nameEl = document.getElementById("customerName");
const note = document.getElementById("formNote");
const modal = document.getElementById("winModal");
const winPrize = document.getElementById("winPrize");

/* ===== utils ===== */
function normalize(v){
  return v.trim().replace(/\s+/g,"").toUpperCase();
}

/* ===== JSONP ===== */
function jsonp(url, params){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Math.random().toString(16).slice(2);
    const qs=new URLSearchParams({callback:cb,...params}).toString();
    const s=document.createElement("script");
    s.src=url+"?"+qs;
    window[cb]=(data)=>{
      delete window[cb];
      s.remove();
      resolve(data);
    };
    s.onerror=()=>reject();
    document.body.appendChild(s);
  });
}

/* ===== submit ===== */
form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  const ticket = normalize(code.value);
  if(!/^RM26-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(ticket)){
    note.textContent="コード形式が正しくありません";
    return;
  }

  note.textContent="抽選中…";

  try{
    const res = await jsonp(API_URL,{
      ticket_code: ticket,
      customer_name: nameEl.value
    });

    if(!res.ok){
      note.textContent="このコードは使用できません";
      return;
    }

    showWin(res.prize);

  }catch{
    note.textContent="通信に失敗しました";
  }
});

/* ===== modal ===== */
function showWin(prize){
  winPrize.textContent = prize + " が当選しました！";
  modal.classList.add("show");
}
function closeWin(){
  modal.classList.remove("show");
}
</script>
</body>
</html>
